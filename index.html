<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>DartsXCasino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0d0818; --card:#1a1230; --accent:#a050ff; --gold:#ffc83c; --text:#f0ebff; --mute:#9a90b8; }
  * { box-sizing:border-box; margin:0; padding:0; font-family: system-ui, sans-serif; }
  body { background:var(--bg); color:var(--text); min-height:100vh; padding:16px; }
  h1 { font-size:22px; }
  .sub { color:var(--mute); font-size:13px; margin-bottom:16px; }
  .bal { background:linear-gradient(135deg,#1a1230,#2a1850); border-radius:16px; padding:18px; margin-bottom:18px; border:1px solid rgba(160,80,255,.3); }
  .bal .amt { font-size:28px; font-weight:800; color:var(--gold); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card {
    background:var(--card); border:1px solid rgba(160,80,255,.25);
    border-radius:14px; padding:16px; text-align:center; cursor:pointer;
  }
  .card:active { transform:scale(.97); }
  .card .ico { font-size:28px; margin-bottom:6px; }
  .card .name { font-weight:700; font-size:14px; }
  .section { margin-bottom:22px; }
  .section h2 { font-size:14px; color:var(--accent); margin-bottom:10px; letter-spacing:1px; }
  .dep { background:var(--card); border-radius:14px; padding:16px; border:1px solid rgba(160,80,255,.25); }
  .dep input, .dep select {
    width:100%; padding:12px; margin:8px 0; border-radius:10px;
    border:1px solid #333; background:#120c22; color:var(--text); font-size:15px;
  }
  .btn {
    width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(135deg,#8b3dff,#c060ff); color:#fff;
    font-weight:700; font-size:15px; cursor:pointer; margin-top:8px;
  }
</style>
</head>
<body>
  <div class="bal">
    <div class="sub">DartsXCasino Mini App</div>
    <div class="amt">Play · Deposit</div>
    <div class="sub">Use bot for live balance · /bal</div>
  </div>
  <div class="section">
    <h2>GAMES</h2>
    <div class="grid" id="games"></div>
  </div>
  <div class="section">
    <h2>DEPOSIT</h2>
    <div class="dep">
      <select id="method">
        <option value="upi">UPI</option>
        <option value="usdt">USDT</option>
        <option value="cwallet">CWallet</option>
      </select>
      <input id="amount" type="number" placeholder="Amount (min 30)" min="30"/>
      <button class="btn" id="depBtn">Request Deposit</button>
      <p class="sub" style="margin-top:10px">Admin verifies & credits in bot.</p>
    </div>
  </div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const GAMES = [
  { ico:'🎲', name:'Dice', cmd:'/dice 50' },
  { ico:'🎯', name:'Darts', cmd:'/dart 50' },
  { ico:'🎳', name:'Bowl', cmd:'/bowl 50' },
  { ico:'🏀', name:'Basket', cmd:'/bask 50' },
  { ico:'⚽', name:'Football', cmd:'/ball 50' },
  { ico:'🪙', name:'Coin', cmd:'/coin 50 heads' },
  { ico:'🎰', name:'Slots', cmd:'/slots 50' },
  { ico:'🃏', name:'Blackjack', cmd:'/bj 50' },
  { ico:'🚀', name:'Limbo', cmd:'/limbo 50 2' },
  { ico:'🔥', name:'Clutch', cmd:'/clutch 50' },
  { ico:'🐵', name:'Tower', cmd:'/tower 50' },
  { ico:'🔮', name:'Predict', cmd:'/predict 50 1 3' },
];
const el = document.getElementById('games');
GAMES.forEach(g => {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<div class="ico">${g.ico}</div><div class="name">${g.name}</div>`;
  d.onclick = () => {
    if (tg) tg.showAlert('In chat send: ' + g.cmd);
    else alert(g.cmd);
  };
  el.appendChild(d);
});
document.getElementById('depBtn').onclick = () => {
  const amount = document.getElementById('amount').value;
  const method = document.getElementById('method').value;
  if (!amount || amount < 30) return alert('Min 30');
  if (tg) tg.showAlert('Deposit request ' + amount + ' via ' + method + '. Wait for admin.');
  else alert(amount + ' ' + method);
};
</script>
</body>
</html>
